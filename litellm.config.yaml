model_list:
  - model_name: apex-primary
    litellm_params:
      # Byesu exposes an OpenAI-compatible endpoint. Using the OpenAI adapter
      # avoids hosted_vllm's strict non-stream JSON parser for this gateway.
      model: openai/gpt-5.5
      api_base: https://byesu.com/v1
      api_key: os.environ/BYESU_API_KEY
      timeout: 240
      rpm: 60
    model_info:
      mode: chat
      input_cost_per_token: 0.000001
      output_cost_per_token: 0.000002
      cache_creation_input_token_cost: 0.000001
      cache_read_input_token_cost: 0.0000005


litellm_settings:
  # LiteLLM owns only the primary deployment. Apex owns direct provider
  # fallback so one logical call cannot hit Mistral/Groq twice.
  drop_params: true
  # Raised to 240s so large extraction and intent prompts on Byesu/gpt-5.5
  # have enough wall-clock time to complete without timing out.
  request_timeout: 240
  num_retries: 0
  # Raised to 3 so transient network blips do not immediately disable the provider.
  allowed_fails: 3
  cooldown_time: 60

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
